<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOIDRIFT</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='50%25' cy='50%25' r='50%25'%3E%3Cstop offset='38%25' stop-color='%23000'/%3E%3Cstop offset='55%25' stop-color='%23ffd08a'/%3E%3Cstop offset='75%25' stop-color='%237fb2ff'/%3E%3Cstop offset='100%25' stop-color='%23060814'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='32' height='32' fill='%23060814'/%3E%3Ccircle cx='16' cy='16' r='13' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23000'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --void-0: #05060d;
        --void-1: #0a0d1a;
        --accent: #7fd8ff;
        --accent-2: #c9a4ff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--void-0); }
      body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #dfe6ff; }
      #renderCanvas {
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
        outline: none;
      }

      /* ---------------- Loading screen ---------------- */
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background:
          radial-gradient(1200px 800px at 50% 38%, #10182e 0%, #060814 55%, #030308 100%);
        z-index: 50;
        transition: opacity 1.1s ease;
      }
      #loader.hidden { opacity: 0; pointer-events: none; }
      .brand {
        font-size: clamp(42px, 9vw, 120px);
        font-weight: 200;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        background: linear-gradient(180deg, #eaf3ff 0%, #8fb6ff 60%, #6a86d8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 26px rgba(120, 170, 255, 0.35));
      }
      .brand-sub {
        font-size: clamp(10px, 1.4vw, 14px);
        letter-spacing: 0.7em;
        text-indent: 0.7em;
        color: #6f83b8;
        text-transform: uppercase;
        margin-top: -18px;
      }
      .bar-wrap {
        width: min(420px, 62vw);
        height: 2px;
        background: rgba(120, 150, 220, 0.16);
        border-radius: 2px;
        overflow: hidden;
      }
      #bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #6ad0ff, #b79bff);
        box-shadow: 0 0 14px rgba(120, 190, 255, 0.7);
        transition: width 0.35s ease;
      }
      #loadMsg {
        font-size: 12px;
        letter-spacing: 0.28em;
        color: #7f92c4;
        text-transform: uppercase;
        min-height: 16px;
      }
      #fatal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px;
        z-index: 60;
        background: #05060d;
      }
      #fatal p { max-width: 640px; line-height: 1.7; color: #aab6e0; font-size: 15px; }
      #fatal b { color: #ff9ba6; font-weight: 600; letter-spacing: 0.04em; }
      .hint {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        font-size: 12px;
        letter-spacing: 0.24em;
        color: #5f719f;
        text-transform: uppercase;
        z-index: 40;
        opacity: 0;
        transition: opacity 0.8s ease;
        pointer-events: none;
      }
      .hint.show { opacity: 0.85; }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>

    <div id="loader">
      <div>
        <div class="brand">VOIDRIFT</div>
        <div class="brand-sub">deep field · exploration</div>
      </div>
      <div class="bar-wrap"><div id="bar"></div></div>
      <div id="loadMsg">initializing</div>
    </div>

    <div id="fatal">
      <p>
        <b>WebGPU unavailable.</b><br /><br />
        VOIDRIFT requires a WebGPU-capable browser (Chrome / Edge, recent stable)
        with hardware acceleration enabled. No fallback path is provided by design.
      </p>
    </div>

    <div class="hint" id="hint">F1 · settings &nbsp;·&nbsp; WASD · fly &nbsp;·&nbsp; SHIFT · boost &nbsp;·&nbsp; 1–5 · systems</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
